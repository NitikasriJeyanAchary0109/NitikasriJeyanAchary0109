<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="100%">
  <defs>
    <style>
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      .txt-dim { fill: #6e7681; }
      .txt-muted { fill: #8b949e; }
      .txt-body { fill: #c9d1d9; }
      .txt-bright { fill: #f0f6fc; }
      .txt-blue { fill: #58a6ff; }
      .txt-gold { fill: #e3b341; }
      .txt-green { fill: #3fb950; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="848" height="278" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />

  <!-- Title Bar -->
  <rect x="1" y="1" width="848" height="34" rx="8" fill="#161b22" />
  <rect x="1" y="28" width="848" height="7" fill="#161b22" />
  <line x1="1" y1="35" x2="849" y2="35" stroke="#21262d" stroke-width="1" />

  <!-- Window Controls (Muted Terminal Style) -->
  <circle cx="20" cy="18" r="5" fill="#da3633" opacity="0.8" />
  <circle cx="36" cy="18" r="5" fill="#d29922" opacity="0.8" />
  <circle cx="52" cy="18" r="5" fill="#238636" opacity="0.8" />

  <!-- Title Bar Text -->
  <text x="425" y="22" class="font-mono txt-muted" font-size="11.5" text-anchor="middle">gh copilot — nitikasri@dev-box — zsh (80x24)</text>

  <!-- CLI Command Prompt -->
  <g transform="translate(24, 62)">
    <text class="font-mono" font-size="13">
      <tspan class="txt-dim">$ </tspan>
      <tspan class="txt-bright" font-weight="600">gh copilot explain </tspan>
      <tspan class="txt-blue">"whoami"</tspan>
    </text>
  </g>

  <!-- Copilot Output Header -->
  <g transform="translate(24, 94)">
    <circle cx="6" cy="-4" r="3.5" fill="#58a6ff" />
    <text x="18" y="0" class="font-mono" font-size="13">
      <tspan class="txt-bright" font-weight="700">Nitikasri</tspan>
      <tspan class="txt-dim"> · </tspan>
      <tspan class="txt-muted">3rd Year B.Tech in Artificial Intelligence &amp; Data Science (Class of '27)</tspan>
    </text>
  </g>

  <!-- Copilot Tree Structure Lines -->
  <g transform="translate(24, 122)" font-size="12.5" class="font-mono">
    <!-- Line 1: Passion -->
    <text x="6" y="0">
      <tspan class="txt-dim">├── </tspan>
      <tspan class="txt-muted">passion   : </tspan>
      <tspan class="txt-bright" font-weight="600">Java Architecture</tspan>
      <tspan class="txt-muted"> &amp; Resilient Backend Systems (Spring Boot, OOP)</tspan>
    </text>

    <!-- Line 2: Systems -->
    <text x="6" y="24">
      <tspan class="txt-dim">├── </tspan>
      <tspan class="txt-muted">systems   : </tspan>
      <tspan class="txt-blue">campus-drift</tspan>
      <tspan class="txt-dim"> (FastAPI/Netmiko) · </tspan>
      <tspan class="txt-blue">mineos</tspan>
      <tspan class="txt-dim"> (Jetson CV + IoT) · </tspan>
      <tspan class="txt-blue">SpareChange AI</tspan>
    </text>

    <!-- Line 3: AI & Data -->
    <text x="6" y="48">
      <tspan class="txt-dim">├── </tspan>
      <tspan class="txt-muted">ai &amp; data : </tspan>
      <tspan class="txt-body">Supervised ML Pipelines · Streamlit Interactive Apps · Local LLMs (Llama 3)</tspan>
    </text>

    <!-- Line 4: Runtime / Personality -->
    <text x="6" y="72">
      <tspan class="txt-dim">└── </tspan>
      <tspan class="txt-muted">runtime   : </tspan>
      <tspan class="txt-gold">"coding while managing to stay alive by a thread."</tspan>
    </text>
    <text x="736" y="72" class="txt-green font-mono" font-size="11">[0 ERRORS]</text>
  </g>

  <!-- Interactive Prompt Divider -->
  <line x1="20" y1="216" x2="830" y2="216" stroke="#21262d" stroke-width="1" />

  <!-- Copilot Interactive Prompt Footer -->
  <g transform="translate(24, 246)">
    <text x="0" y="0" class="font-mono txt-blue" font-size="12" font-weight="700">?</text>
    <text x="14" y="0" class="font-mono txt-muted" font-size="12">Select action:</text>

    <!-- Option 1: Selected -->
    <g transform="translate(112, -15)">
      <rect x="0" y="0" width="168" height="22" rx="4" fill="#161b22" stroke="#388bfd" stroke-width="1" />
      <text x="10" y="15" class="font-mono txt-blue" font-size="11">❯ 1. inspect-projects</text>
    </g>

    <!-- Option 2 -->
    <g transform="translate(290, -15)">
      <rect x="0" y="0" width="156" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="12" y="15" class="font-mono txt-muted" font-size="11">  2. explore-stack</text>
    </g>

    <!-- Option 3 -->
    <g transform="translate(456, -15)">
      <rect x="0" y="0" width="144" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="12" y="15" class="font-mono txt-muted" font-size="11">  3. grab-coffee</text>
    </g>

    <!-- Status pill -->
    <g transform="translate(732, -15)">
      <circle cx="8" cy="11" r="3.5" fill="#3fb950" />
      <text x="18" y="15" class="font-mono txt-green" font-size="11">READY</text>
    </g>
  </g>
</svg>
